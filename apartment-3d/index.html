<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宇宙公寓｜互動 3D 格局</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171a20;color:#f4f4f4;font-family:system-ui,"Noto Sans TC",sans-serif}header{padding:12px 16px;background:#222832;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header small{display:block;color:#bbc3ce;margin-top:3px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button{background:#374150;color:white;border:1px solid #667386;border-radius:8px;padding:8px 11px;cursor:pointer}button.active,button:hover{background:#b9473e}#layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:12px;height:calc(100vh - 104px);min-height:500px}#view{position:relative;min-height:480px;border:1px solid #59616d;border-radius:10px;overflow:hidden}canvas{display:block;width:100%;height:100%}#hint,#info{position:absolute;top:12px;background:#111c;border:1px solid #ffffff2a;border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.7;pointer-events:none}#hint{left:12px}#info{right:12px;max-width:220px}aside{background:#f6f4ef;color:#222;border-radius:10px;overflow:auto}aside h2{margin:0;padding:12px;background:#222832;color:white;font-size:15px}aside p{padding:0 12px;font-size:13px;line-height:1.6}aside .placeholder{margin:12px;border:1px dashed #999;padding:20px;text-align:center;color:#555;border-radius:8px}footer{padding:8px 14px;color:#b9c1cb;font-size:11px}@media(max-width:850px){#layout{grid-template-columns:1fr;grid-template-rows:minmax(420px,60vh) auto;height:auto}#view{height:60vh;min-height:420px}aside{min-height:180px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body>
<header><div><strong>宇宙公寓｜互動 3D 格局</strong><small>依房屋廣告示意圖推估；法庭已保留，臥室牆線避開床鋪</small></div><div class="tools"><button id="top">俯視</button><button id="iso" class="active">立體視角</button><button id="labels" class="active">房間標籤</button><button id="reset">重設視角</button></div></header>
<main id="layout"><section id="view"><div id="hint">左鍵拖曳：旋轉｜滾輪：縮放<br>右鍵拖曳：平移｜點擊家具查看空間</div><div id="info">空間：客廳、餐廳、廚房、主臥、次臥、法庭、浴室、廁所、玄關</div></section>
<aside><h2>原始平面參考圖</h2><div class="placeholder">原始廣告圖尚未嵌入此公開頁面<br>目前先發布互動 3D 模型</div><p>本模型依廣告示意圖重建，並非比例施工圖；尺寸、門窗及家具位置為推估，僅供格局理解。</p></aside></main><footer>GitHub Pages 公開展示頁｜使用滑鼠或觸控操作 3D 模型。</footer>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const host=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x252b33);
const camera=new THREE.PerspectiveCamera(42,host.clientWidth/host.clientHeight,.1,100);camera.position.set(12,11,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=5;controls.maxDistance=28;
scene.add(new THREE.HemisphereLight(0xffffff,0x777f8b,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-8,15,9);scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82}),m={floor:M(0xd8d2c7),wall:M(0xf3f0e8),wood:M(0x9c7048),wood2:M(0xb98e62),dark:M(0x51483f),fabric:M(0xb7b4ad),white:M(0xf7f3e9),blue:M(0x82b5c4),court:M(0xd8c9a8),glass:new THREE.MeshStandardMaterial({color:0x9ccbd6,transparent:true,opacity:.7})};
const root=new THREE.Group();scene.add(root);const tags=[],pick=[];function cube(x,y,z,a,b,c,mat,name){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;root.add(o);if(name){o.userData.room=name;pick.push(o)}return o}function floor(x,z,a,c,mat=m.floor){cube(x,-.13,z,a,.22,c,mat)}function wx(a,b,z){if(b>a)cube((a+b)/2,1.275,z,b-a,2.55,.14,m.wall)}function wz(x,a,b){if(b>a)cube(x,1.275,(a+b)/2,.14,2.55,b-a,m.wall)}
function label(t,x,z){let c=document.createElement('canvas');c.width=400;c.height=100;let g=c.getContext('2d');g.fillStyle='#202832dd';g.beginPath();g.roundRect(3,3,394,94,14);g.fill();g.fillStyle='white';g.font='bold 42px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,200,50);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.position.set(x,2.9,z);s.scale.set(1.8,.45,1);root.add(s);tags.push(s)}
floor(0,0,10,8);floor(-3.25,1.8,3.4,4,M(0xd4d7d2));floor(-.85,2.15,2.8,3.3,M(0xcdbb9d));floor(3.15,2.15,3.2,3.3,M(0xd6cfc2));floor(.9,-.05,2.5,3.7,m.court);floor(-.85,-2.55,3,2.7,M(0xd4c6ae));floor(3.2,-2.45,3.4,2.9,M(0xd9d5cd));
wz(-5,-4,4);wz(5,-4,4);wx(-5,5,-4);wx(-5,3.8,4);wx(4.65,5,4);
wz(-2.35,.45,4);wx(-2.35,-.35,.45);wz(1.45,.55,4);wx(-2.35,-1.15,.55);wx(-.45,1.45,.55);wx(1.45,2.2,.55);wx(3.05,5,.55);
wz(-3.65,-1.9,4);wx(-5,-3.65,1.85);wx(-5,-3.65,-.35);wz(-3.65,-4,-2.7);wz(2.2,-1.8,.55);wx(0,2.2,-1.8);wz(-2.35,-3.9,-1.25);
// Beds are fully inside bedrooms; divider walls do not cross mattresses.
cube(-.55,.22,2.55,1.75,.28,1.95,m.wood,'主臥');cube(-.55,.42,2.55,1.68,.18,1.86,m.white);cube(-.55,.55,1.82,1.68,.12,.42,m.blue);
cube(3.2,.22,2.55,1.72,.28,1.95,m.wood,'次臥');cube(3.2,.42,2.55,1.65,.18,1.86,m.white);cube(3.2,.55,1.82,1.65,.12,.42,m.blue);cube(-1.9,.95,3.55,.55,1.8,.55,m.wood2);cube(4.45,.95,3.55,.55,1.8,.55,m.wood2);
// Kitchen and dining
cube(-4.45,.48,-2.5,.62,.96,2.5,m.white,'廚房');cube(-4.45,1,-2.5,.68,.08,2.55,m.floor);cube(-3.1,.48,-2.9,1.55,.96,.65,m.wood2);cube(-1.55,.78,-2.85,1.5,.14,.85,m.wood,'餐廳');for(let [x,z]of[[-2.2,-3.5],[-.9,-3.5],[-2.2,-2.2],[-.9,-2.2]])cube(x,.38,z,.38,.68,.38,m.fabric);
// Living room
cube(3.1,.45,-3,2.15,.72,.82,m.fabric,'客廳');cube(3.1,.83,-3.34,2.15,.38,.16,m.white);cube(2.8,.28,-1.8,1.1,.12,.62,m.wood2);
// Courtroom: judge bench, counsel tables and seats
cube(.95,.62,.05,1.65,.85,.42,m.wood,'法庭');cube(.95,1.08,.05,1.72,.12,.46,m.wood2);cube(.95,.38,-.72,1.15,.12,.48,m.wood2);cube(.95,.38,.85,1.15,.12,.48,m.wood2);for(let x of[.35,1.55]){cube(x,.22,-1.18,.34,.42,.34,m.dark);cube(x,.22,1.25,.34,.42,.34,m.dark)}
// Bathroom / toilet / entry
cube(-4.25,.18,2.65,1,.14,1.2,m.glass,'浴室');cube(-4.25,.35,2.65,.84,.28,1,m.blue);cube(-3.15,.4,2.85,.58,.72,.58,m.white,'洗手間');cube(-3.15,.3,1.35,.58,.55,.62,m.white,'廁所');cube(4.45,.48,-.15,.45,.95,1.25,m.wood2,'玄關');
label('廚房',-4.1,-2);label('餐廳',-1.55,-2.85);label('客廳',3.1,-2.75);label('主臥',-.55,3);label('次臥',3.2,3);label('法庭',.95,-.05);label('浴室',-4.25,3.25);label('廁所',-3.2,1);label('玄關',4.45,-.2);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),M(0x252b33));ground.rotation.x=-Math.PI/2;ground.position.y=-.27;scene.add(ground);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{let r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);let h=ray.intersectObjects(pick,false)[0];if(h)document.querySelector('#info').textContent='選取空間：'+h.object.userData.room+'（示意配置）'});
function view(top){camera.position.set(...(top?[0,19,.01]:[12,11,13]));controls.target.set(0,0,0);controls.update()}document.querySelector('#top').onclick=()=>{view(true);document.querySelector('#top').classList.add('active');document.querySelector('#iso').classList.remove('active')};document.querySelector('#iso').onclick=()=>{view(false);document.querySelector('#iso').classList.add('active');document.querySelector('#top').classList.remove('active')};document.querySelector('#reset').onclick=()=>view(false);document.querySelector('#labels').onclick=e=>{let on=!tags[0].visible;tags.forEach(t=>t.visible=on);e.target.classList.toggle('active',on)};
window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
